name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

# A new PR commit replaces the old run. Push/manual runs stay independent:
# cancelling a pending push could otherwise omit changes from the next diff.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: CI / plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      static: ${{ steps.select.outputs.static }}
      image: ${{ steps.select.outputs.image }}
      db: ${{ steps.select.outputs.db }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test CI selection and required gate
        run: node --test scripts/ci-plan.test.mjs
      - name: Select checks from the complete change
        id: select
        run: node scripts/ci-plan.mjs

  static:
    name: static
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm env:example --check
      - run: pnpm contracts:generate --check
      - run: pnpm test
      - run: pnpm test:runtime
      - run: pnpm audit --prod --audit-level=high

  db:
    name: db / ${{ matrix.engine }} / ${{ matrix.command }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}
    needs: plan
    if: needs.plan.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Same engine/shard coverage for each selected tier; isolation is unchanged.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        # Cockroach jobs start their own service below and do not need PostgreSQL.
        image: ${{ matrix.engine == 'postgres' && 'pgvector/pgvector:pg16' || '' }}
        env:
          POSTGRES_DB: focale_ci_admin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d focale_ci_admin"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ALLOW_DB_TESTS: "1"
      TEST_DB_ADMIN_URL: ${{ matrix.engine == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/focale_ci_admin' || '' }}
      TEST_DB_ALLOWED_HOSTS: 127.0.0.1
      TEST_DB_MAX_WORKERS: ${{ matrix.engine == 'postgres' && '2' || '1' }}
      TEST_DB_SETUP_TIMEOUT_MS: ${{ matrix.engine == 'postgres' && '120000' || '300000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Start disposable CockroachDB 26.2.5
        if: matrix.engine == 'cockroach'
        run: |
          certs_dir="$RUNNER_TEMP/focale-ci-crdb-certs"
          mkdir -p "$certs_dir"
          docker run --rm --user "$(id -u):$(id -g)" -v "$certs_dir:/certs" \
            --entrypoint=/cockroach/cockroach cockroachdb/cockroach:v26.2.5 \
            cert create-ca --certs-dir=/certs --ca-key=/certs/ca.key
          docker run --rm --user "$(id -u):$(id -g)" -v "$certs_dir:/certs" \
            --entrypoint=/cockroach/cockroach cockroachdb/cockroach:v26.2.5 \
            cert create-node localhost 127.0.0.1 --certs-dir=/certs --ca-key=/certs/ca.key
          docker run --rm --user "$(id -u):$(id -g)" -v "$certs_dir:/certs" \
            --entrypoint=/cockroach/cockroach cockroachdb/cockroach:v26.2.5 \
            cert create-client root --certs-dir=/certs --ca-key=/certs/ca.key
          docker run -d --name focale-ci-crdb -p 127.0.0.1:26257:26257 -p 127.0.0.1:8080:8080 \
            -v "$certs_dir:/cockroach/certs" --entrypoint=/cockroach/cockroach \
            cockroachdb/cockroach:v26.2.5 start-single-node \
            --certs-dir=/cockroach/certs --listen-addr=0.0.0.0:26257 \
            --advertise-addr=localhost:26257 --http-addr=0.0.0.0:8080 \
            --store=type=mem,size=1GiB
          for _attempt in $(seq 1 60); do
            if docker exec focale-ci-crdb /cockroach/cockroach sql \
              --certs-dir=/cockroach/certs --host=localhost:26257 --execute='SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec focale-ci-crdb /cockroach/cockroach sql \
            --certs-dir=/cockroach/certs --host=localhost:26257 --execute='CREATE DATABASE focale_ci_admin'
          docker exec focale-ci-crdb /cockroach/cockroach sql \
            --certs-dir=/cockroach/certs --host=localhost:26257 \
            --execute='SET CLUSTER SETTING feature.vector_index.enabled = true'
          echo "TEST_DB_ADMIN_URL=postgresql://root@127.0.0.1:26257/focale_ci_admin?sslmode=verify-full&sslrootcert=$certs_dir/ca.crt&sslcert=$certs_dir/client.root.crt&sslkey=$certs_dir/client.root.key" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.command }}${{ matrix.shard && format(' (shard {0})', matrix.shard) || '' }}
        # A shard can hold no file of a small package (--passWithNoTests).
        run: pnpm ${{ matrix.command }} ${{ matrix.shard && format('--shard={0} --passWithNoTests', matrix.shard) || '' }}

  image:
    name: image / migrator plan
    needs: plan
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime image
        run: docker build -f Dockerfile -t focale-backend:ci .
      - name: Check migration plan in image
        run: docker run --rm --entrypoint node focale-backend:ci packages/db/dist/migrator/cli.js plan
      - name: Check runtime settings in image
        run: |
          docker run --rm --entrypoint node focale-backend:ci -e "
            const fs = require('node:fs');
            if (process.env.TZ !== 'UTC' || new Date().getTimezoneOffset() !== 0) throw new Error('TZ is not UTC');
            for (const f of ['start-runtime.mjs', 'healthcheck.mjs']) if (!fs.existsSync(f)) throw new Error(f + ' missing');
          "
          docker image inspect --format '{{json .Config.Healthcheck.Test}}' focale-backend:ci | grep -q healthcheck.mjs

  required:
    name: CI / required
    if: always()
    needs: [plan, static, db, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Require every selected check to pass
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
          CI_STATIC_REQUIRED: ${{ needs.plan.outputs.static }}
          CI_STATIC_RESULT: ${{ needs.static.result }}
          CI_DB_REQUIRED: ${{ needs.plan.outputs.db }}
          CI_DB_RESULT: ${{ needs.db.result }}
          CI_IMAGE_REQUIRED: ${{ needs.plan.outputs.image }}
          CI_IMAGE_RESULT: ${{ needs.image.result }}
        run: node scripts/ci-plan.mjs check
